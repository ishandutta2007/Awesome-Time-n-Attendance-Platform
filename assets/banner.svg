<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#101b38"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="pulse-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    
    /* Dynamic CSS Keyframe Animations */
    @keyframes rotateClock {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseRing {
      0% { r: 75px; opacity: 0.8; }
      50% { r: 90px; opacity: 0.3; }
      100% { r: 75px; opacity: 0.8; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.7; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes dashCycle {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 600; }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .clock-second {
      transform-origin: 1020px 180px;
      animation: rotateClock 12s linear infinite;
    }
    .clock-minute {
      transform-origin: 1020px 180px;
      animation: rotateClock 60s linear infinite;
    }
    .clock-hour {
      transform-origin: 1020px 180px;
      animation: rotateClock 360s linear infinite;
    }
    .pulse-circle {
      animation: pulseRing 4s ease-in-out infinite;
    }
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 8s ease-in-out 1s infinite; }
    .particle-3 { animation: floatParticle 7s ease-in-out 2s infinite; }
    .stream-line {
      stroke-dasharray: 20, 10;
      animation: dashCycle 20s linear infinite;
    }
    .live-dot {
      animation: blinkDot 1.5s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Border Frame with gradient -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="url(#accent-grad)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Subtle Matrix/Grid Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>

  <!-- Floating Glow Orbs / Particles -->
  <circle class="particle-1" cx="240" cy="90" r="4" fill="#38bdf8"/>
  <circle class="particle-2" cx="720" cy="70" r="5" fill="#818cf8"/>
  <circle class="particle-3" cx="500" cy="280" r="3.5" fill="#c084fc"/>
  <circle class="particle-1" cx="880" cy="290" r="4" fill="#38bdf8"/>

  <!-- Ambient Glow Behind Time Clock Graphic -->
  <circle cx="1020" cy="180" r="110" fill="url(#pulse-grad)"/>
  <circle class="pulse-circle" cx="1020" cy="180" r="80" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Left Content Info -->
  <g transform="translate(80, 0)">
    <!-- Pill Tag -->
    <g transform="translate(0, 52)">
      <rect width="250" height="30" rx="15" fill="#0f2b48" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <circle class="live-dot" cx="18" cy="15" r="5" fill="#22c55e"/>
      <text x="32" y="20" class="badge-text">ENTERPRISE &amp; OPEN SOURCE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" class="title">
      Awesome <tspan fill="url(#accent-grad)">Time &amp; Attendance</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="174" class="subtitle">
      Curated Workforce Management, Employee Time Tracking &amp; Scheduling Ecosystem
    </text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 218)">
      <!-- Item 1: Time Tracking -->
      <g transform="translate(0, 0)">
        <rect width="160" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="16" y="26" font-family="system-ui, sans-serif" font-size="14" fill="#f8fafc">⏱️ Time Clocks</text>
      </g>
      <!-- Item 2: Timesheets & HRMS -->
      <g transform="translate(175, 0)">
        <rect width="180" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="16" y="26" font-family="system-ui, sans-serif" font-size="14" fill="#f8fafc">📅 Shifts &amp; Schedules</text>
      </g>
      <!-- Item 3: Geofencing & GPS -->
      <g transform="translate(370, 0)">
        <rect width="170" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="16" y="26" font-family="system-ui, sans-serif" font-size="14" fill="#f8fafc">📍 GPS &amp; Geofencing</text>
      </g>
      <!-- Item 4: Payroll & Compliance -->
      <g transform="translate(555, 0)">
        <rect width="175" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="16" y="26" font-family="system-ui, sans-serif" font-size="14" fill="#f8fafc">💳 Payroll Exports</text>
      </g>
    </g>

    <text x="0" y="302" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">
      ⚡ Comprehensive SaaS directory with exact pricing tiers + GitHub open-source repositories sorted by stars
    </text>
  </g>

  <!-- Right Visual: Dynamic Animated Clock & Workforce Radar -->
  <!-- Outer Radial Track -->
  <circle cx="1020" cy="180" r="76" fill="#0f172a" stroke="#1e293b" stroke-width="6"/>
  <circle class="stream-line" cx="1020" cy="180" r="76" fill="none" stroke="url(#accent-grad)" stroke-width="3" opacity="0.8"/>

  <!-- Clock Hour Ticks -->
  <g stroke="#64748b" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <line x1="1020" y1="112" x2="1020" y2="120" />
    <line x1="1020" y1="240" x2="1020" y2="248" />
    <line x1="952" y1="180" x2="960" y2="180" />
    <line x1="1080" y1="180" x2="1088" y2="180" />
  </g>

  <!-- Animated Clock Hands -->
  <!-- Hour hand -->
  <line class="clock-hour" x1="1020" y1="180" x2="1020" y2="142" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line class="clock-minute" x1="1020" y1="180" x2="1020" y2="126" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <!-- Second hand with glowing tip -->
  <line class="clock-second" x1="1020" y1="188" x2="1020" y2="116" stroke="#ec4899" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Center Cap -->
  <circle cx="1020" cy="180" r="5" fill="#38bdf8"/>
  <circle cx="1020" cy="180" r="2.5" fill="#ffffff"/>

  <!-- Orbiting Badge Node -->
  <g transform="translate(1020, 180)">
    <circle cx="68" cy="-58" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="68" y="-53" text-anchor="middle" font-size="12">👥</text>
  </g>
  <g transform="translate(1020, 180)">
    <circle cx="-68" cy="58" r="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="-68" y="63" text-anchor="middle" font-size="12">📊</text>
  </g>
</svg>
